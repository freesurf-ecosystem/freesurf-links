name = "freesurf-link-in-bio"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

# Custom domains
routes = [
  { pattern = "links.freesurf.tools/*", zone_name = "freesurf.tools" },
  { pattern = "freesurf.tools/@*", zone_name = "freesurf.tools" }
]

# R2 bucket for avatar images only
[[r2_buckets]]
binding = "AVATARS"
bucket_name = "freesurf-profiles"

# Static assets (brand logos / favicon)
[assets]
directory = "./static"
not_found_handling = "none"

# KV namespace for analytics counters (views + clicks)
[[kv_namespaces]]
binding = "ANALYTICS"
id = "83e2a67160b44b1495e4d00519e5a38a"

[vars]
ENVIRONMENT = "production"

# Secrets to set via `wrangler secret put`:
#   SUPABASE_JWT_SECRET — your Supabase JWT signing secret
